<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Missing ISRCs</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Applies the saved or system color scheme before the first paint, so dark-mode visitors never
      see a white flash. Keep the key, class and query in sync with src/app/core/theme/theme.constants.ts
      (a unit test fails if they drift).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('orp.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <orp-root></orp-root>
  </body>
</html>
