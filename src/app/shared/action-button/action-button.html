<ng-template #content>
  <svg
    [class]="'action__mark ' + iconName()"
    viewBox="0 0 24 24"
    aria-hidden="true"
    focusable="false"
  >
    <path [attr.d]="iconPath()" />
  </svg>
  <span class="action__label">{{ label() }}</span>
</ng-template>

@if (href(); as url) {
  <a class="action" target="_blank" rel="noopener noreferrer" [href]="url">
    <ng-container [ngTemplateOutlet]="content" />
    @if (newTabLabel(); as hint) {
      <span class="visually-hidden">({{ hint }})</span>
    }
  </a>
} @else {
  <button class="action" type="button" (click)="pressed.emit()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
