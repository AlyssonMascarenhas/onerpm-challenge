<p-dialog
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [closeAriaLabel]="closeLabel()"
  [header]="title()"
  [visible]="visible()"
  [style]="{ width: '30rem', maxWidth: 'calc(100vw - 2rem)' }"
  (visibleChange)="visible.set($event)"
  (onHide)="closed.emit()"
>
  <p class="affected__hint">{{ hint() }}</p>
  <ul class="affected__list" tabindex="0" [attr.aria-label]="listLabel()">
    @for (item of items(); track item.isrc) {
      <li class="affected__item">
        <span class="affected__isrc">{{ item.isrc }}</span>
        <orp-copy-button [value]="item.isrc" [label]="item.label" [copiedLabel]="copiedLabel()" />
      </li>
    }
  </ul>
  <ng-template #footer>
    <orp-copy-button
      [value]="allText()"
      [label]="copyAllLabel()"
      [caption]="copyAllLabel()"
      [copiedLabel]="copiedLabel()"
    />
    @if (retryable()) {
      <p-button
        severity="secondary"
        icon="pi pi-refresh"
        [label]="retryLabel()"
        [outlined]="true"
        [buttonProps]="{ autofocus: false }"
        (onClick)="retry.emit()"
      />
    }
  </ng-template>
</p-dialog>
