<footer class="footer">
  <div class="footer__inner">
    <p class="footer__line">
      <a
        class="footer__link footer__author"
        target="_blank"
        rel="noopener noreferrer"
        [href]="authorUrl"
      >
        {{ authorName }}<span class="visually-hidden"> ({{ newTab() }})</span>
      </a>
      <span class="footer__separator" aria-hidden="true">·</span>
      <span>{{ builtFor() }}</span>
    </p>

    <p class="footer__line footer__line--muted">
      <a class="footer__link" target="_blank" rel="noopener noreferrer" [href]="repositoryUrl">
        <i class="pi pi-github" aria-hidden="true"></i>
        {{ sourceCode() }}<span class="visually-hidden"> ({{ newTab() }})</span>
      </a>
      <span class="footer__separator" aria-hidden="true">·</span>
      <span>{{ dataFrom() }}</span>
    </p>
  </div>
</footer>
